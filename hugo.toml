baseURL = "https://concordrecyclingcenter.com/"
locale = "en-us"
title = "Concord Recycling Center"
uglyURLs = true
disableKinds = ["taxonomy", "term"]

[security]
  allowContent = ["^text/html$", "^text/markdown$", "^text/plain$"]

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "images"
    target = "static/images"
  [[module.mounts]]
    source = "js"
    target = "static/js"
  [[module.mounts]]
    source = "references"
    target = "static/references"

[params]
  description = "CRV and Scrap Recycling Center"
  keywords = "recycling, CRV, bottles, cans, recycle"

[[menus.main]]
  name = "Home"
  url = "index.html"
  weight = 1

[[menus.main]]
  name = "Location/Hours"
  url = "location.html"
  weight = 2

[[menus.main]]
  name = "Recyclables"
  url = "recyclables.html"
  weight = 3

[[menus.main]]
  name = "Investigations"
  url = "investigations.html"
  weight = 4

[[menus.main]]
  name = "CA State Laws"
  url = "calaws.html"
  weight = 5
